services:
  # ---------- Les bases de données : UNE PAR SERVICE ----------
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: users_db
    volumes:
      - pg_users:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-enrollments:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: enrollments_db
    volumes:
      - pg_enrollments:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d enrollments_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-courses:
    image: mongo:7
    volumes:
      - mongo_courses:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 10

  mongo-notifications:
    image: mongo:7
    volumes:
      - mongo_notifications:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ---------- Le facteur : RabbitMQ transporte les messages entre services ----------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"   # interface web : http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------- Les 4 microservices (aucun port publié : invisibles depuis l'extérieur) ----------
  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-users:5432/users_db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres-users:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
    command: npm run dev

  course-service:
    build: ./services/course-service
    environment:
      PORT: 3002
      MONGO_URL: mongodb://mongo-courses:27017/courses_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo-courses:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/course-service:/app
      - /app/node_modules
    command: npm run dev

  enrollment-service:
    build: ./services/enrollment-service
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-enrollments:5432/enrollments_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      COURSE_SERVICE_URL: http://course-service:3002
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-enrollments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      course-service:
        condition: service_started
    volumes:
      - ./services/enrollment-service:/app
      - /app/node_modules
    command: npm run dev

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3004
      MONGO_URL: mongodb://mongo-notifications:27017/notifications_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongo-notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
    command: npm run dev

  # ---------- La porte d'entrée unique ----------
  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      USER_SERVICE_URL: http://user-service:3001
      COURSE_SERVICE_URL: http://course-service:3002
      ENROLLMENT_SERVICE_URL: http://enrollment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - notification-service
    volumes:
      - ./gateway:/app
      - /app/node_modules
    command: npm run dev

  # ---------- Le frontend : IDENTIQUE à celui du monolithe ----------
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pg_users:
  pg_enrollments:
  mongo_courses:
  mongo_notifications:
